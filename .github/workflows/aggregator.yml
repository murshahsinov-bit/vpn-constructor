name: Update VPN Configs

on:
  schedule:
    # Раз в час: частая массовая проверка прокси повышает риск блокировки аккаунта.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      skip_latency:
        description: "Пропустить проверку задержки (быстрая сборка без топа)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vpn-configs
  cancel-in-progress: false

jobs:
  build:
    # По умолчанию — GitHub-hosted runner (не Россия).
    # Для настоящей проверки из РФ задайте repository variable
    # RU_RUNNER_LABELS='["self-hosted","linux","ru"]' и подключите runner в России.
    runs-on: ${{ vars.RU_RUNNER_LABELS != '' && fromJSON(vars.RU_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install xray-knife
        run: |
          # v11.5.0 — проверенная версия: встраивает Xray-core, отдельный
          # бинарник ядра не нужен. Формат JSON: link/status/delay/ip.
          go install github.com/lilendian0x00/xray-knife/v11@v11.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/xray-knife" --help > /dev/null
          echo "xray-knife installed from $(go env GOPATH)/bin"

      - name: Show test origin
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_OS)"
          COUNTRY=$(curl -fsS --max-time 10 https://ipinfo.io/country || echo "??")
          echo "Checker country: $COUNTRY"
          if [ "$COUNTRY" != "RU" ]; then
            echo "::warning::Проверка идёт не из России ($COUNTRY). Пинг будет измерен из дата-центра GitHub. Для реального RU-отбора задайте RU_RUNNER_LABELS и self-hosted runner."
          fi

      - name: Run Aggregator
        env:
          XRAY_KNIFE_BIN: xray-knife
          SKIP_LATENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_latency == true && '1' || '0' }}
        run: python -m aggregator.run

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/subscriptions/
          if git diff --staged --quiet; then
            echo "Конфиги не изменились, коммит не требуется."
          else
            git commit -m "Auto-update VPN configs [skip ci]"
            git push
          fi
