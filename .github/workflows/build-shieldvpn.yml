name: Build ShieldVPN APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI filter (empty = universal APK: arm64-v8a + armeabi-v7a)"
        required: false
        default: ""
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: shieldvpn-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ShieldVPN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The SDK ships "platforms;android-37.0" (minor-versioned platform), not
      # "platforms;android-37". Classic cmdline-tools 13114758 is pinned because
      # the newer "android sdk" CLI shim cannot parse semicolon package paths.
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/classic"
          yes | "$SDK_ROOT/cmdline-tools/classic/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/classic/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Fetch prebuilt native libraries
        run: bash scripts/fetch-libs.sh

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -n "${INPUT_ABI}" ]; then
            ./gradlew --no-daemon --stacktrace assemblePlaystoreRelease -PABI_FILTERS="$INPUT_ABI"
          else
            ./gradlew --no-daemon --stacktrace assemblePlaystoreRelease
          fi
        env:
          INPUT_ABI: ${{ github.event.inputs.abi }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldVPN-apk
          if-no-files-found: error
          path: ShieldVPN/app/build/outputs/apk/playstore/release/*.apk
