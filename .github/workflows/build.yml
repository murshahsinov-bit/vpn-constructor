name: Release ShieldVPN APK

# Push a tag such as v1.0.0 and this workflow builds the universal APK and
# attaches it to a GitHub Release. The landing page (site/index.html) links to
# /releases/latest, so a fresh tag is all it takes to publish a new download.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: shieldvpn-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ShieldVPN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/classic"
          yes | "$SDK_ROOT/cmdline-tools/classic/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/classic/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Restore release keystore
        # Without the secret the APK is signed with the debug key, which is still
        # installable (IzzyOnDroid rebuilds from source anyway).
        #
        # The check lives in the shell on purpose: GitHub rejects the whole
        # workflow file ("Unrecognized named-value: 'secrets'") when a step-level
        # `if:` references the secrets context.
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 is not set - releasing with the debug signing key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          {
            echo "storeFile=../keystore.jks"
            echo "storePassword=${KEYSTORE_PASSWORD:-}"
            echo "keyAlias=${KEY_ALIAS:-}"
            echo "keyPassword=${KEY_PASSWORD:-}"
          } > keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Fetch prebuilt native libraries
        run: bash scripts/fetch-libs.sh

      - name: Build release APKs
        # One APK per ABI instead of a 48 MB universal file: the Xray core plus the
        # 23 MB geoip.dat are packaged once per architecture, which keeps every
        # download at ~36 MB (IzzyOnDroid's per-APK budget is 30 MB, exceptions
        # above that; v2rayNG itself ships similar sizes).
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assemblePlaystoreRelease \
            -PABI_FILTERS="arm64-v8a;armeabi-v7a" \
            -PFIREBASE_API_KEY="$FIREBASE_API_KEY" \
            -PFIREBASE_APP_ID="$FIREBASE_APP_ID" \
            -PFIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            -PFIREBASE_WEB_CLIENT_ID="$FIREBASE_WEB_CLIENT_ID"
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}

      - name: Rename artifacts
        # The Gradle output already carries version and ABI
        # (ShieldVPN_1.0.0_arm64-v8a.apk), which is what the landing page links to.
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in app/build/outputs/apk/playstore/release/*.apk; do
            cp "$apk" "dist/$(basename "$apk")"
          done
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ShieldVPN ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ShieldVPN/dist/*.apk
          fail_on_unmatched_files: true
