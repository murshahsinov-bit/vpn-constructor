aggregator:
  modes:
    - auto
    - whitelist
  
  # Оставляем много серверов, чтобы INCY было из чего выбирать
  max_servers_per_subscription: 300
  
  health_check:
    timeout_seconds: 5.0
    concurrency: 50

  scoring:
    min_score_to_keep: 0

paths:
  templates_dir: "aggregator/templates"
  output_dir: "web/subscriptions"