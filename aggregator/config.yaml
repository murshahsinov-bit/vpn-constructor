aggregator:
  modes:
    - auto
    - whitelist
  
  # 30 серверов — золотая середина для стабильности и скорости
  max_servers_per_subscription: 30
  
  health_check:
    timeout_seconds: 5.0
    concurrency: 50

  scoring:
    min_score_to_keep: 0

paths:
  templates_dir: "aggregator/templates"
  output_dir: "web/subscriptions"