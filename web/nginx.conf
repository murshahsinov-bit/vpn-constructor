server {
    listen 80;
    server_name your-domain.com; # Замените на ваш домен

    # Корневая папка для статики (index.html) и подписок
    root /var/www/vpn-constructor/web;
    index index.html index.htm;

    # Скрываем версию Nginx в заголовках (безопасность)
    server_tokens off;

    # Включаем GZIP для ускорения загрузки JSON и HTML
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 768;

    # 1. Раздача главной страницы (SPA-подход)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Раздача JSON-подписок с поддержкой комментариев и защиты от кэширования
    location /sub/ {
        # Включаем CORS, чтобы клиенты (INCY, браузеры) могли запрашивать файлы
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # Обработка предварительных запросов CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Отключаем кэширование, чтобы пользователи всегда получали актуальные серверы
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;

        # Отдаём файлы строго из папки subscriptions и не даём выйти за её пределы
        alias /var/www/vpn-constructor/web/subscriptions/;
        try_files $uri =404;
    }

    # 3. Защита от скрытых файлов
    location ~ /\. {
        deny all;
    }
}